<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Micael G. Fernandes</title>
    <link rel="icon" type="image/png" href="images/icons/favicon.png">
    <!-- Marks that JS runs: the no-JS page shows the card right away and hides the button. -->
    <script>document.documentElement.classList.add('js');</script>
    <link rel="stylesheet" href="css/site.css">
</head>
<body>
    <main class="stage">
        <div class="hero">
            <button id="box" class="box" type="button">
                <span class="box-label">Build Website</span>
            </button>

            <!-- Built live by the bot cursors (js/build.js), one section per click. The cards are
                 empty until built. Each sentence lives in a <noscript>: it is the no-JS fallback
                 and the single source that js/build.js reads and types.
                 data-prompt = button label while that section is the next one to build. -->
            <div id="cards" class="cards">
                <section class="card" aria-label="Introduction">
                    <p class="card-text"><noscript>Hi, welcome to my personal website</noscript><span class="typed"></span><span class="caret" aria-hidden="true"></span><span class="rest" aria-hidden="true"></span></p>
                </section>
                <section class="card" aria-label="About me" data-prompt="Who are you?">
                    <p class="card-text"><noscript>I'm Micael Gomes Fernandes, or online ._lazybox_.</noscript><span class="typed"></span><span class="caret" aria-hidden="true"></span><span class="rest" aria-hidden="true"></span></p>
                </section>
            </div>
        </div>
    </main>

    <!-- Announces build progress to screen readers -->
    <p id="status" class="sr-only" role="status"></p>

    <!-- Fake cursors are spawned into this layer by js/cursors.js -->
    <div id="cursor-layer" class="cursor-layer" aria-hidden="true"></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
